[package]
name = "sisa-health-checks-nats"
description = "A NATS health check for Sisa Health Checks, on an async-nats client"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
# The tests use sisa-health-checks-testing, which isn't published, so a downloaded crate couldn't
# build them.
exclude = ["tests/"]
keywords = ["health-check", "nats", "messaging", "readiness"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
# The contract this crate implements.
sisa-health-checks-core = { workspace = true }

# The client whose connection the check reads and flushes.
async-nats = { workspace = true }

[dev-dependencies]
sisa-health-checks-testing = { workspace = true }
tokio = { workspace = true }
