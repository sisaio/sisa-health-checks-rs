[package]
name = "sisa-health-checks-postgres"
description = "A PostgreSQL health check for Sisa Health Checks, on an sqlx pool"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
# The tests use sisa-health-checks-testing, which isn't published, so a downloaded crate couldn't
# build them.
exclude = ["tests/"]
keywords = ["health-check", "postgres", "sqlx", "readiness"]
categories = ["database", "asynchronous"]

[lints]
workspace = true

[dependencies]
# The contract this crate implements.
sisa-health-checks-core = { workspace = true }

# The pool the check queries.
sqlx = { workspace = true }

[dev-dependencies]
sisa-health-checks-testing = { workspace = true }
tokio = { workspace = true }
