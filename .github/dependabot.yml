# Weekly version updates for Cargo and the SHA-pinned actions.
# Patch and minor updates are grouped per ecosystem, and major updates stay separate.
# Dependabot doesn't update the server images in ci.yml and crates/testing; `postgres:17-alpine`,
# `redis:8-alpine` and `nats:2-alpine` follow their major version by themselves.
# Commit titles start with `build(deps)`, and PRs carry only the `dependencies` label, not
# Dependabot's per-ecosystem ones.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    labels: [dependencies]
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    labels: [dependencies]
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
