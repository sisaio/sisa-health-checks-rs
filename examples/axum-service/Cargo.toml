[package]
name = "sisa-health-checks-example-axum-service"
description = "A service with liveness and readiness probes over PostgreSQL, Redis and NATS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
sisa-health-checks = { workspace = true, features = ["http", "postgres", "redis", "nats"] }

# The server, its runtime, and Ctrl-C and SIGTERM.
axum = { workspace = true, features = ["tokio", "http1"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
# The connection the Redis check uses.
redis = { workspace = true, features = ["connection-manager"] }
tracing = { workspace = true }
# The logs, and the OTLP export of the registry's metrics.
sisa-telemetry = { workspace = true }

[dev-dependencies]
# Reads back the metrics a registry records, without a Collector.
sisa-telemetry = { workspace = true, features = ["testing"] }
# Sends requests to the router without a server.
tower = { workspace = true, features = ["util"] }
