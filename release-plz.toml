# release-plz opens and updates the release PR: the maintainer opens it by running the release
# workflow. Tagging, the GitHub release and publishing are release.yml's own jobs, not
# release-plz's. The six crates share one version and one changelog at the root, carried by
# `sisa-health-checks-core`.
[workspace]
changelog_update = false
pr_labels = ["release"]

# Changelog sections come from each commit's type (CONTRIBUTING.md#commit-messages). Work users
# don't see is left out unless it is marked breaking.
[changelog]
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "added" },
    { message = "^(fix|revert)", group = "fixed" },
    { message = "^perf", group = "changed" },
    { message = "^(refactor|docs|test|build|ci|chore)", skip = true },
    { message = "^.*", group = "other" },
]

[[package]]
name = "sisa-health-checks-core"
changelog_update = true
changelog_path = "./CHANGELOG.md"
# The tag release.yml makes, which the changelog's compare links point at.
git_tag_name = "v{{ version }}"
changelog_include = ["sisa-health-checks", "sisa-health-checks-axum", "sisa-health-checks-postgres", "sisa-health-checks-redis", "sisa-health-checks-nats"]
